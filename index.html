<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Noticias Gran Concepción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f1; --paper: #ffffff; --ink: #1b1a1f; --muted: #6a6670; --line: #e4e0d8;
    --accent: #5b2d8e; --accent-soft: #efe8f7; --new: #d9480f; --chip: #f0ede7; --ok: #2b8a3e; --err: #c92a2a;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131216; --paper: #1c1b21; --ink: #ecebef; --muted: #9b97a3; --line: #2e2c35;
            --accent: #b392e0; --accent-soft: #2a2236; --new: #ff8a4c; --chip: #26242c; --shadow: none; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15.5px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  header.top { border-bottom: 3px double var(--line); background: var(--paper); }
  .masthead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 18px 16px 12px; flex-wrap: wrap; }
  .brand { font-family: Fraunces, Georgia, serif; font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 700; letter-spacing: -.01em; margin: 0; line-height: 1.05; }
  .brand span { color: var(--accent); }
  .date { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .status { font-size: .8rem; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; margin-right: 5px; }
  .dot.live { background: #f08c00; }
  .btn { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 8px;
         padding: 6px 10px; font: inherit; font-size: .82rem; cursor: pointer; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  nav.tabs { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent);
             backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .tabrow { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .tabrow::-webkit-scrollbar { display: none; }
  .tab { flex: none; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 500;
         padding: 12px 12px 10px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .n { font-size: .7rem; background: var(--new); color: #fff; border-radius: 999px; padding: 0 6px; margin-left: 4px; vertical-align: 2px; }

  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 14px 0 4px; }
  .tools input[type=search] { flex: 1; min-width: 180px; max-width: 340px; padding: 8px 12px; border-radius: 8px;
         border: 1px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 999px;
          padding: 4px 10px; font: inherit; font-size: .8rem; cursor: pointer; }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .toggle { display: flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); margin-left: auto; }

  main { padding: 8px 0 48px; }
  h2.sec { font-family: Fraunces, Georgia, serif; font-size: 1.35rem; margin: 26px 0 12px; display: flex;
           align-items: baseline; justify-content: space-between; gap: 10px; border-top: 1px solid var(--ink); padding-top: 8px; }
  h2.sec button { font-family: Inter, sans-serif; font-size: .8rem; font-weight: 500; color: var(--accent); background: none; border: 0; cursor: pointer; }
  h3.sub { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 10px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
  .grid.lead { grid-template-columns: 2fr 1fr 1fr; }
  .grid.lead .card:first-child { grid-row: span 2; }
  .grid.lead .card:first-child h4 { font-size: 1.4rem; }
  .grid.lead .card:first-child img { aspect-ratio: 16/10; }
  @media (max-width: 860px) { .grid.lead { grid-template-columns: 1fr 1fr; } .grid.lead .card:first-child { grid-column: span 2; grid-row: auto; } }
  @media (max-width: 560px) { .grid.lead { grid-template-columns: 1fr; } .grid.lead .card:first-child { grid-column: auto; } }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
          display: flex; flex-direction: column; box-shadow: var(--shadow); transition: transform .15s; }
  .card:hover { transform: translateY(-2px); }
  .card.fresh { outline: 2px solid var(--new); outline-offset: -1px; }
  .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--chip); }
  .card .b { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .meta { font-size: .74rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .src { font-weight: 600; color: var(--accent); }
  .tag { background: var(--chip); border-radius: 999px; padding: 0 7px; }
  .tag.zona { background: var(--accent-soft); color: var(--accent); }
  .tag.nuevo { background: var(--new); color: #fff; font-weight: 600; }
  .tag.prog { background: var(--ink); color: var(--paper); }
  .card h4 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 1.07rem; line-height: 1.28; margin: 0; }
  .card h4 a { text-decoration: none; }
  .card h4 a:hover { color: var(--accent); }
  .card p { margin: 0; font-size: .88rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .empty, .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  .more { display: block; margin: 22px auto 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(120px); background: var(--ink); color: var(--paper);
           padding: 10px 16px; border-radius: 999px; font-size: .9rem; box-shadow: 0 6px 24px rgba(0,0,0,.25); transition: transform .3s; z-index: 10; cursor: pointer; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: .8rem; padding: 18px 0 40px; }
  footer .srcs { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
  footer a { color: var(--muted); }
  .warn { background: #fff4e6; color: #8a4b08; border: 1px solid #ffd8a8; border-radius: 10px; padding: 10px 14px; font-size: .86rem; margin-top: 14px; }
  @media (prefers-color-scheme: dark) { .warn { background: #2b2116; color: #ffc078; border-color: #5c3d17; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap masthead">
    <div>
      <h1 class="brand">Noticias del <span>Gran Concepción</span></h1>
      <div class="date" id="hoy"></div>
    </div>
    <div class="status">
      <span><span class="dot" id="dot"></span><span id="estado">Cargando…</span></span>
      <span id="prox"></span>
      <button class="btn" id="refrescar" title="Revisar ahora">↻ Actualizar</button>
    </div>
  </div>
</header>

<nav class="tabs"><div class="wrap tabrow" id="tabs"></div></nav>

<div class="wrap">
  <div id="aviso"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Buscar en las noticias…" aria-label="Buscar">
    <div class="chips" id="fuentes"></div>
    <label class="toggle" id="zonaBox" hidden><input type="checkbox" id="soloZona"> Solo de la zona</label>
  </div>
  <main id="main"><div class="loading">Cargando noticias…</div></main>
</div>

<footer><div class="wrap">
  <div>Titulares y resúmenes de cada medio, con enlace a la nota original. Se revisa cada 10 minutos.</div>
  <div class="srcs" id="estadoFuentes"></div>
</div></footer>

<div class="toast" id="toast"></div>

<script>
// ===== Configuración =====
// Si tu repositorio tiene otro nombre, cambia la segunda dirección.
const CONFIG = {
  datos: [
    'noticias.json',
    'https://raw.githubusercontent.com/rormenom/noticias-conce/main/noticias.json',
  ],
  cadaMinutos: 10,
};

const CATS = [
  { id: 'portada', nombre: 'Portada' },
  { id: 'regional', nombre: 'Regional' },
  { id: 'nacional', nombre: 'Nacional' },
  { id: 'internacional', nombre: 'Internacional' },
  { id: 'deportes', nombre: 'Deportes', zona: true },
  { id: 'cultura', nombre: 'Cultura', zona: true },
  { id: 'tecnologia', nombre: 'Tecnología' },
  { id: 'tendencias', nombre: 'Tendencias' },
  { id: 'podcasts', nombre: 'Podcasts y programas' },
];

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem('nc:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('nc:' + k, JSON.stringify(v)); } catch {} },
};

const S = {
  data: null, modo: '', tab: location.hash.slice(1) || 'portada', q: '',
  ocultas: new Set(store.get('ocultas', [])), soloZona: store.get('soloZona', false),
  conocidas: new Set(), nuevas: new Set(), vistas: new Set(store.get('vistas', [])),
  limite: 36, ultimaRevision: 0,
};
if (!CATS.some(c => c.id === S.tab)) S.tab = 'portada';

// ===== Utilidades =====
function haceCuanto(iso) {
  const min = Math.round((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'ahora';
  if (min < 60) return `hace ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `hace ${h} h`;
  if (h < 48) return 'ayer';
  return new Date(iso).toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
}
const hora = d => d.toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
const seguro = u => /^https?:\/\//i.test(u || '') ? u : '';
const plain = h => { const d = document.createElement('div'); d.innerHTML = h || ''; return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
const cut = (s, n = 260) => s.length > n ? s.slice(0, n).replace(/\s+\S*$/, '') + '…' : s;

// ===== Datos =====
async function cargarJSON() {
  for (const url of CONFIG.datos) {
    try {
      const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) continue;
      const d = await r.json();
      if (Array.isArray(d.items) && d.items.length) return d;
    } catch {}
  }
  return null;
}

// Respaldo: si aún no está el repositorio, lee directo los dos medios que tienen API abierta
async function cargarDirecto() {
  const fuentes = [
    { id: 'conquistador', nombre: 'El Conquistador', base: 'https://www.elconquistadorconcepcion.cl',
      map: { regional: 'regional', nacional: 'nacional', internacional: 'internacional', deportes: 'deportes', cultura: 'cultura',
             tecnologia: 'tecnologia', tendencias: 'tendencias', 'mesa-de-noticias': 'podcasts', 'nuevo-dia': 'podcasts', 'pasado-meridiano': 'podcasts' } },
    { id: 'radioudec', nombre: 'Radio UdeC', base: 'https://www.radioudec.cl',
      map: { regional: 'regional', udec: 'regional', nacional: 'nacional', internacional: 'internacional', deportes: 'deportes',
             cultura: 'cultura', ciencia: 'tecnologia', tecnologia: 'tecnologia', innovacion: 'tecnologia', salud: 'tendencias' } },
  ];
  const items = [], estado = [];
  await Promise.all(fuentes.map(async f => {
    try {
      const r = await fetch(`${f.base}/wp-json/wp/v2/posts?per_page=50&_embed=1`);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      for (const p of await r.json()) {
        const terms = (p._embedded?.['wp:term'] || []).flat().filter(t => t?.taxonomy === 'category');
        const titulo = plain(p.title?.rendered);
        let cats = [...new Set(terms.map(t => f.map[t.slug] || (t.slug.includes('podcast') ? 'podcasts' : null)).filter(Boolean))];
        if (cats.includes('podcasts') || (titulo === titulo.toUpperCase() && /\d{1,2} DE [A-ZÁÉÍÓÚ]+ (DE )?\d{4}/.test(titulo))) cats = ['podcasts'];
        if (!cats.length) continue;
        const m = p._embedded?.['wp:featuredmedia']?.[0], sz = m?.media_details?.sizes || {};
        const texto = titulo + ' ' + plain(p.excerpt?.rendered);
        items.push({ url: p.link, titulo, resumen: cut(plain(p.excerpt?.rendered)),
          imagen: sz.medium_large?.source_url || sz.medium?.source_url || m?.source_url || '',
          fecha: new Date((p.date_gmt || p.date) + (p.date_gmt ? 'Z' : '')).toISOString(),
          fuente: f.nombre, fuenteId: f.id, cats,
          local: cats.includes('regional') || /concepci|biob[ií]o|talcahuano|hualp|san pedro de la paz|chiguayante|coronel|lota|penco|huachipato|fern[aá]ndez vial|udec/i.test(texto) });
      }
      estado.push({ id: f.id, nombre: f.nombre, url: f.base, ok: true });
    } catch (e) { estado.push({ id: f.id, nombre: f.nombre, url: f.base, ok: false, error: e.message }); }
  }));
  items.sort((a, b) => b.fecha.localeCompare(a.fecha));
  return items.length ? { generado: new Date().toISOString(), fuentes: estado, items } : null;
}

async function actualizar(manual = false) {
  $('estado').textContent = 'Revisando…';
  let d = await cargarJSON(), modo = 'repo';
  if (!d) { d = await cargarDirecto(); modo = 'directo'; }
  S.ultimaRevision = Date.now();
  if (!d) {
    $('estado').textContent = 'Sin conexión con las fuentes';
    if (!S.data) $('main').innerHTML = '<div class="empty">No se pudieron cargar las noticias. Revisa tu conexión y vuelve a intentar.</div>';
    return;
  }
  // Detectar noticias nuevas desde la revisión anterior
  const urls = d.items.map(i => i.url);
  let nuevas = 0;
  if (S.conocidas.size) for (const u of urls) if (!S.conocidas.has(u)) { S.nuevas.add(u); nuevas++; }
  urls.forEach(u => S.conocidas.add(u));
  S.data = d; S.modo = modo;
  if (nuevas) mostrarToast(nuevas === 1 ? '1 noticia nueva' : `${nuevas} noticias nuevas`);
  else if (manual) mostrarToast('Sin noticias nuevas por ahora');
  pintarEstado(); pintarTabs(); pintarFuentes(); pintar();
}

// ===== Interfaz =====
function pintarEstado() {
  const d = S.data;
  $('dot').className = 'dot' + (S.modo === 'directo' ? ' live' : '');
  $('estado').textContent = `Datos de las ${hora(new Date(d.generado))} · revisado ${hora(new Date(S.ultimaRevision))}`;
  $('aviso').innerHTML = S.modo === 'directo'
    ? '<div class="warn">Mostrando solo El Conquistador y Radio UdeC (lectura directa). Cuando el repositorio de GitHub esté activo aparecerán los seis medios.</div>' : '';
  $('estadoFuentes').innerHTML = '';
  for (const f of d.fuentes || []) {
    const a = document.createElement('a');
    a.href = seguro(f.url); a.target = '_blank'; a.rel = 'noopener';
    a.textContent = (f.ok ? '● ' : '○ ') + f.nombre + (f.ok ? '' : ' (sin datos)');
    a.style.color = f.ok ? '' : 'var(--err)';
    if (f.error) a.title = f.error;
    $('estadoFuentes').appendChild(a);
  }
  const n = S.nuevas.size;
  document.title = (n ? `(${n}) ` : '') + 'Noticias Gran Concepción';
}

function pintarTabs() {
  $('tabs').innerHTML = '';
  for (const c of CATS) {
    const b = document.createElement('button');
    b.className = 'tab' + (c.id === S.tab ? ' on' : '');
    b.textContent = c.nombre;
    const n = c.id === 'portada' ? 0 : (S.data?.items || []).filter(i => i.cats.includes(c.id) && S.nuevas.has(i.url) && !S.vistas.has(i.url)).length;
    if (n) { const s = document.createElement('span'); s.className = 'n'; s.textContent = n; b.appendChild(s); }
    b.onclick = () => irA(c.id);
    $('tabs').appendChild(b);
  }
  const cat = CATS.find(c => c.id === S.tab);
  $('zonaBox').hidden = !cat?.zona;
  $('soloZona').checked = S.soloZona;
}

function pintarFuentes() {
  const nombres = [...new Set((S.data?.items || []).map(i => i.fuente))].sort();
  $('fuentes').innerHTML = '';
  for (const n of nombres) {
    const b = document.createElement('button');
    b.className = 'chip' + (S.ocultas.has(n) ? '' : ' on');
    b.textContent = n;
    b.onclick = () => { S.ocultas.has(n) ? S.ocultas.delete(n) : S.ocultas.add(n); store.set('ocultas', [...S.ocultas]); pintarFuentes(); pintar(); };
    $('fuentes').appendChild(b);
  }
}

function irA(id) {
  S.tab = id; S.limite = 36;
  history.replaceState(null, '', '#' + id);
  pintarTabs(); pintar();
  window.scrollTo({ top: 0 });
}

function filtrados(cat) {
  const q = S.q.toLowerCase();
  return S.data.items.filter(i =>
    (!cat || i.cats.includes(cat)) && !S.ocultas.has(i.fuente) &&
    (!q || (i.titulo + ' ' + i.resumen + ' ' + i.fuente).toLowerCase().includes(q)));
}

function tarjeta(i, cat) {
  const el = document.createElement('article');
  const esNueva = S.nuevas.has(i.url) && !S.vistas.has(i.url);
  el.className = 'card' + (esNueva ? ' fresh' : '');
  const url = seguro(i.url), img = seguro(i.imagen);
  if (img) {
    const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.tabIndex = -1;
    const im = document.createElement('img'); im.loading = 'lazy'; im.alt = ''; im.src = img; im.referrerPolicy = 'no-referrer';
    im.onerror = () => a.remove();
    a.appendChild(im); el.appendChild(a);
  }
  const b = document.createElement('div'); b.className = 'b';
  const m = document.createElement('div'); m.className = 'meta';
  const add = (t, cls) => { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = t; m.appendChild(s); };
  add(i.fuente, 'src'); add(haceCuanto(i.fecha));
  if (esNueva) add('NUEVO', 'tag nuevo');
  if (i.cats.includes('podcasts')) add('▶ Programa', 'tag prog');
  if (i.local && (cat === 'deportes' || cat === 'cultura')) add('Zona', 'tag zona');
  b.appendChild(m);
  const h = document.createElement('h4'); const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = i.titulo;
  a.onclick = () => { S.vistas.add(i.url); store.set('vistas', [...S.vistas].slice(-600)); };
  h.appendChild(a); b.appendChild(h);
  if (i.resumen) { const p = document.createElement('p'); p.textContent = i.resumen; b.appendChild(p); }
  el.appendChild(b);
  return el;
}

function grilla(list, cat, lead = false) {
  const g = document.createElement('div'); g.className = 'grid' + (lead ? ' lead' : '');
  list.forEach(i => g.appendChild(tarjeta(i, cat)));
  return g;
}

function seccion(titulo, verTodo) {
  const h = document.createElement('h2'); h.className = 'sec'; h.textContent = titulo;
  if (verTodo) { const b = document.createElement('button'); b.textContent = 'Ver todo →'; b.onclick = () => irA(verTodo); h.appendChild(b); }
  return h;
}

// En deportes y cultura, primero lo de la zona
const ordenZona = list => [...list.filter(i => i.local), ...list.filter(i => !i.local)];

function pintar() {
  const main = $('main');
  main.innerHTML = '';
  if (!S.data) return;

  if (S.tab === 'portada') {
    const todas = filtrados();
    if (!todas.length) { main.innerHTML = '<div class="empty">No hay noticias con este filtro.</div>'; return; }
    const ultimas = filtrados('regional').slice(0, 5);
    if (ultimas.length) { main.appendChild(seccion('Lo último en la región', 'regional')); main.appendChild(grilla(ultimas, 'regional', true)); }
    const usadas = new Set(ultimas.map(i => i.url));
    for (const c of CATS.slice(1)) {
      let l = filtrados(c.id).filter(i => !usadas.has(i.url));
      if (c.zona) l = ordenZona(l);
      l = l.slice(0, 4);
      if (!l.length) continue;
      l.forEach(i => usadas.add(i.url));
      main.appendChild(seccion(c.nombre, c.id)); main.appendChild(grilla(l, c.id));
    }
    return;
  }

  const cat = CATS.find(c => c.id === S.tab);
  let l = filtrados(cat.id);
  if (!l.length) { main.innerHTML = '<div class="empty">No hay noticias en esta sección por ahora.</div>'; return; }
  main.appendChild(seccion(cat.nombre));

  if (cat.zona) {
    const zona = l.filter(i => i.local), resto = l.filter(i => !i.local);
    if (zona.length) { const h = document.createElement('h3'); h.className = 'sub'; h.textContent = 'De la zona'; main.appendChild(h); main.appendChild(grilla(zona.slice(0, S.limite), cat.id)); }
    else { const p = document.createElement('div'); p.className = 'empty'; p.textContent = 'Sin noticias de la zona en este momento.'; main.appendChild(p); }
    if (!S.soloZona && resto.length) {
      const h = document.createElement('h3'); h.className = 'sub'; h.textContent = 'Chile y el mundo'; main.appendChild(h);
      main.appendChild(grilla(resto.slice(0, S.limite), cat.id));
    }
    l = S.soloZona ? zona : (zona.length > resto.length ? zona : resto);
  } else {
    main.appendChild(grilla(l.slice(0, S.limite), cat.id));
  }
  if (l.length > S.limite) {
    const b = document.createElement('button'); b.className = 'btn more'; b.textContent = 'Ver más';
    b.onclick = () => { S.limite += 36; pintar(); };
    main.appendChild(b);
  }
}

let toastT;
function mostrarToast(txt) {
  const t = $('toast'); t.textContent = txt; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 5000);
}

// ===== Eventos y ciclo de 10 minutos =====
$('toast').onclick = () => { $('toast').classList.remove('show'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
$('refrescar').onclick = () => actualizar(true);
$('soloZona').onchange = e => { S.soloZona = e.target.checked; store.set('soloZona', S.soloZona); pintar(); };
let qT; $('q').oninput = e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); S.limite = 36; pintar(); }, 250); };
window.addEventListener('hashchange', () => { const id = location.hash.slice(1); if (CATS.some(c => c.id === id) && id !== S.tab) irA(id); });

const intervalo = CONFIG.cadaMinutos * 60000;
setInterval(() => { if (!document.hidden) actualizar(); }, intervalo);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - S.ultimaRevision > intervalo) actualizar(); });
setInterval(() => {
  if (!S.ultimaRevision) return;
  const resta = Math.max(0, Math.ceil((S.ultimaRevision + intervalo - Date.now()) / 60000));
  $('prox').textContent = `próxima revisión en ${resta} min`;
}, 30000);

const fechaHoy = new Date().toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
$('hoy').textContent = fechaHoy.charAt(0).toUpperCase() + fechaHoy.slice(1);
actualizar().then(() => { $('prox').textContent = `próxima revisión en ${CONFIG.cadaMinutos} min`; });
</script>
